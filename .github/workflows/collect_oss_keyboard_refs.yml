name: Collect OSS Keyboard References

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect_oss_keyboard_refs.yml'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect pinned source snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p refs out

          fetch_repo() {
            name="$1"
            url="$2"
            sha="$3"
            license="$4"
            git init -q "refs/$name"
            git -C "refs/$name" remote add origin "$url"
            git -C "refs/$name" fetch -q --depth 1 origin "$sha"
            git -C "refs/$name" checkout -q FETCH_HEAD
            rm -rf "refs/$name/.git"
            cat > "refs/$name/SOURCE_INFO.txt" <<EOF
          Reference snapshot for KKKeyboard research only.
          Repository: $url
          Commit: $sha
          Declared primary license: $license
          Keep original LICENSE/NOTICE files and review dependency licenses before copying code into the product.
          EOF
            (cd refs && zip -qr "../out/${name}_${sha:0:12}.zip" "$name")
          }

          fetch_repo "FlorisBoard" "https://github.com/florisboard/florisboard.git" "5d6e1ef824e32b128fda890b0ac2dce645b23f5c" "Apache-2.0"
          fetch_repo "SimpleKeyboard" "https://github.com/rkkr/simple-keyboard.git" "ae49483ce31fc030ac20a96c37f34aaef2f78957" "Apache-2.0"
          fetch_repo "azooKey" "https://github.com/azooKey/azooKey.git" "7234b3c0fba37de4cffb491cbe1993219152351c" "MIT"
          fetch_repo "AzooKeyKanaKanjiConverter" "https://github.com/azooKey/AzooKeyKanaKanjiConverter.git" "ad714fea8cb2fe113aea86ba5c42563cdaf77cfb" "MIT"
          fetch_repo "fcitx5-android" "https://github.com/fcitx5-android/fcitx5-android.git" "6998502528cd26efb6079556da92003638e4179c" "LGPL-2.1"

          cat > out/README_KKKeyboard_OSS_References.txt <<'EOF'
          These archives are research/reference snapshots, not vendored dependencies.
          Do not copy code blindly into KKKeyboard.
          Prefer clean reimplementation of ideas/architecture unless a specific file is intentionally adopted with license obligations reviewed.
          Stronger/copyleft or mixed third-party license obligations may apply inside repositories even when the top-level project has a permissive license.
          EOF

      - name: Upload reference pack
        uses: actions/upload-artifact@v4
        with:
          name: kkkeyboard-oss-reference-pack
          path: out/*
          if-no-files-found: error
          retention-days: 7
