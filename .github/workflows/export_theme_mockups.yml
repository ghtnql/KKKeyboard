name: Export Theme Mockups

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export_theme_mockups.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload theme mockups
        uses: actions/upload-artifact@v4
        with:
          name: kkkeyboard-theme-mockups
          path: design_mockups/*.jpg
          if-no-files-found: error
          retention-days: 1
