name: Append theme rules to AGENTS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append_theme_rules.yml'

permissions:
  contents: write

jobs:
  update-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append theme mockup rules
        shell: bash
        env:
          THEME_RULES_B64: 
        run: |
          if grep -q '테마 시안 해석 규칙과 금지 예시' AGENTS.md; then
            echo 'Theme rules already present.'
            exit 0
          fi
          printf '%s' "$THEME_RULES_B64" | base64 -d >> AGENTS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md
          git commit -m 'docs: clarify theme mockup rules and Busan anti-pattern'
          git push
