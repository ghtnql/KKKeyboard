name: Theme Review Contact Sheet

on:
  push:
    branches: [main]
    paths:
      - 'design_mockups/**'
      - '.github/workflows/theme_review.yml'
  workflow_dispatch:

jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pillow
      - name: Build contact sheet
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          from pathlib import Path

          files = sorted(Path('design_mockups').glob('*.jpg'))
          thumb_w, thumb_h = 720, 405
          label_h = 54
          cols = 2
          rows = (len(files) + cols - 1) // cols
          canvas = Image.new('RGB', (cols*thumb_w, rows*(thumb_h+label_h)), '#111318')
          draw = ImageDraw.Draw(canvas)
          try:
              font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 24)
          except Exception:
              font = ImageFont.load_default()

          for i, p in enumerate(files):
              img = Image.open(p).convert('RGB')
              img = ImageOps.fit(img, (thumb_w, thumb_h), method=Image.Resampling.LANCZOS)
              x = (i % cols) * thumb_w
              y = (i // cols) * (thumb_h + label_h)
              canvas.paste(img, (x, y))
              draw.rectangle((x, y+thumb_h, x+thumb_w, y+thumb_h+label_h), fill='#1b1f26')
              draw.text((x+16, y+thumb_h+12), p.name, font=font, fill='white')

          out = Path('theme_contact_sheet.jpg')
          canvas.save(out, quality=90)
          print(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: theme-contact-sheet
          path: theme_contact_sheet.jpg
          if-no-files-found: error
