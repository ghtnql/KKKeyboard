name: iOS CI

on:
  push:
    branches: [main, bootstrap/android-mvp]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'shared/**'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'shared/**'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app and keyboard extension
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project KKKeyboard.xcodeproj \
            -scheme KKKeyboard \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        working-directory: ios
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild \
            -project KKKeyboard.xcodeproj \
            -scheme KKKeyboard \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee xcodebuild-test.log

      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-diagnostics
          path: |
            ios/xcodebuild-test.log
            ios/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 7
