name: iOS CI

on:
  push:
    branches: [main, bootstrap/android-mvp]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'shared/**'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'shared/**'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app and keyboard extension
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project KKKeyboard.xcodeproj \
            -scheme KKKeyboard \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
